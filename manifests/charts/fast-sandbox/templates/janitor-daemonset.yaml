{{- if .Values.janitor.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fast-sandbox-janitor
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: janitor
    app: fast-sandbox-janitor
spec:
  selector:
    matchLabels:
      app: fast-sandbox-janitor
  template:
    metadata:
      labels:
        app: fast-sandbox-janitor
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9092"
        prometheus.io/scrape: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: janitor
        command: [/workspace/janitor]
        args:
        - --scan-interval={{ .Values.janitor.scanInterval }}
        - --orphan-timeout={{ .Values.janitor.orphanTimeout }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: {{ include "fast-sandbox.image" .Values.janitor.image }}
        imagePullPolicy: {{ .Values.janitor.image.pullPolicy }}
        ports:
        - name: metrics
          containerPort: 9092
        securityContext:
          privileged: true
        volumeMounts:
        - name: sock
          mountPath: /run/containerd/containerd.sock
        - name: fifo
          mountPath: /run/containerd/fifo
        - name: network-state
          mountPath: /run/fast-sandbox/network
        - name: node-cleanup
          mountPath: /run/fast-sandbox/janitor
        - name: network-namespaces
          mountPath: /run/netns
          mountPropagation: Bidirectional
        - name: boxlite-state
          mountPath: /var/lib/fast-sandbox/boxlite
        - name: runtime-environments
          mountPath: /etc/fast-sandbox/runtime-environments
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostPID: true
      serviceAccountName: fast-sandbox-janitor
      tolerations:
      - operator: Exists
      volumes:
      - name: sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: fifo
        hostPath:
          path: /run/containerd/fifo
          type: DirectoryOrCreate
      - name: network-state
        hostPath:
          path: /run/fast-sandbox/network
          type: DirectoryOrCreate
      - name: node-cleanup
        hostPath:
          path: /run/fast-sandbox/janitor
          type: DirectoryOrCreate
      - name: network-namespaces
        hostPath:
          path: /run/fast-sandbox/netns
          type: DirectoryOrCreate
      - name: boxlite-state
        hostPath:
          path: /var/lib/fast-sandbox/boxlite
          type: DirectoryOrCreate
      - name: runtime-environments
        configMap:
          name: fast-sandbox-runtime-environments
{{- end }}
