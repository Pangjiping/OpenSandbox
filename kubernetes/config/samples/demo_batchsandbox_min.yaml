apiVersion: sandbox.opensandbox.io/v1alpha1
kind: BatchSandbox
metadata:
  name: bsbx-demo
  namespace: default
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: bsbx-demo
    spec:
      runtimeClassName: gvisor
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.opensandbox.io/sandbox
                    operator: In
                    values: ["true"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["cn-hangzhou-a"]
      tolerations:
        - key: sandbox.opensandbox.io/dedicated
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo hello from $(hostname); sleep 3600"]
