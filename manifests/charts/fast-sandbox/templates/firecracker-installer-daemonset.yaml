{{- if .Values.firecrackerInstaller.enabled }}
---
# Node installer for the Firecracker runtime assets: an init container
# fetches the pinned Firecracker release (binary + jailer) and the guest
# kernel onto a node hostPath; the main container just holds the DaemonSet
# and verifies the installed binaries.
#
# Installed layout (must match runtimeEnvironments above):
#   /opt/fast-sandbox/firecracker/firecracker
#   /opt/fast-sandbox/firecracker/jailer
#   /opt/fast-sandbox/firecracker/vmlinux.bin
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: firecracker-runtime-installer
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: firecracker-installer
    app: fast-sandbox
    component: firecracker-runtime-installer
spec:
  selector:
    matchLabels:
      app: fast-sandbox
      component: firecracker-runtime-installer
  template:
    metadata:
      labels:
        app: fast-sandbox
        component: firecracker-runtime-installer
    spec:
      {{- if .Values.firecrackerInstaller.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.firecrackerInstaller.nodeSelector | nindent 8 }}
      {{- end }}
      hostNetwork: true
      initContainers:
      - name: install-firecracker
        image: curlimages/curl:8.10.1
        # curlimages/curl runs as a non-root user by default; the hostPath
        # destination is root-owned, so install as root.
        securityContext:
          runAsUser: 0
          privileged: true
        command: ["/bin/sh", "-euxc"]
        args:
        - |
          FC_VERSION="{{ .Values.firecrackerInstaller.fcVersion }}"
          DEST="/opt/fast-sandbox/firecracker"
          KERNEL_URL="{{ .Values.firecrackerInstaller.kernelUrl }}"
          ARCH="$(uname -m)"
          case "$ARCH" in x86_64) ASSET_ARCH="x86_64";; aarch64) ASSET_ARCH="aarch64";; *) echo "unsupported arch $ARCH" >&2; exit 1;; esac
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/firecracker" || ! -x "$DEST/jailer" ]]; then
            TARBALL="/tmp/firecracker-${FC_VERSION}-${ASSET_ARCH}.tgz"
            curl -fL --retry 5 --retry-all-errors -o "$TARBALL" \
              "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-${ASSET_ARCH}.tgz"
            mkdir -p /tmp/fc-extract
            tar -xzf "$TARBALL" -C /tmp/fc-extract
            find /tmp/fc-extract -type f -name "firecracker-v*-${ASSET_ARCH}" -exec cp {} "$DEST/firecracker" \;
            find /tmp/fc-extract -type f -name "jailer-v*-${ASSET_ARCH}" -exec cp {} "$DEST/jailer" \;
            chmod +x "$DEST/firecracker" "$DEST/jailer"
            rm -rf /tmp/fc-extract "$TARBALL"
          fi
          if [[ ! -f "$DEST/vmlinux.bin" ]]; then
            curl -fL --retry 5 --retry-all-errors -o "$DEST/vmlinux.bin" "$KERNEL_URL"
          fi
          "$DEST/firecracker" --version >/dev/null
          "$DEST/jailer" --version >/dev/null
          test -s "$DEST/vmlinux.bin"
        volumeMounts:
        - name: firecracker-assets
          mountPath: /opt/fast-sandbox/firecracker
      containers:
      - name: verify
        image: alpine:3.19
        command: ["/bin/sh", "-ec"]
        args:
        - |
          /opt/fast-sandbox/firecracker/firecracker --version
          /opt/fast-sandbox/firecracker/jailer --version
          echo "firecracker runtime assets verified on node"
          while true; do sleep 3600; done
        securityContext:
          privileged: true
        volumeMounts:
        - name: firecracker-assets
          mountPath: /opt/fast-sandbox/firecracker
      volumes:
      - name: firecracker-assets
        hostPath:
          path: /opt/fast-sandbox/firecracker
          type: DirectoryOrCreate
{{- end }}
