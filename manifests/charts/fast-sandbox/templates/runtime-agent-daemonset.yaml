{{- if .Values.runtimeAgent.enabled }}
{{- $ns := include "fast-sandbox.namespace" . }}
{{- $dartDiscover := printf "dns:dart.%s.svc.cluster.local:%d" $ns (int .Values.runtimeAgent.dartPeerPort) }}
{{- $probeCmd := printf "curl -fsS -X POST --unix-socket %s/runtime.sock -H 'Content-Type: application/json' -d '{\"podUid\":\"$POD_UID\",\"namespace\":\"%s\"}' http://firecracker-agent/v1/health | grep -q '\"ok\":true'" .Values.runtimeAgent.socketDir $ns }}
---
# Headless Service backing DART peer discovery: DNS seeding hands out the
# ready agent Pod IPs so node-local DART daemons can find each other
# (discovery needs addresses, not load balancing).
apiVersion: v1
kind: Service
metadata:
  name: dart
  namespace: {{ $ns }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-agent
    app: fast-sandbox
    component: firecracker-runtime-agent
spec:
  clusterIP: None
  selector:
    app: fast-sandbox
    component: firecracker-runtime-agent
  ports:
  - name: peer
    port: {{ .Values.runtimeAgent.dartPeerPort }}
    targetPort: peer
    protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: firecracker-runtime-agent
  namespace: {{ $ns }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-agent
    app: fast-sandbox
    component: firecracker-runtime-agent
spec:
  selector:
    matchLabels:
      app: fast-sandbox
      component: firecracker-runtime-agent
  template:
    metadata:
      labels:
        app: fast-sandbox
        component: firecracker-runtime-agent
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runtimeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.runtimeAgent.nodeSelector | nindent 8 }}
      {{- end }}
      # The agent runs on the cluster network (NOT hostNetwork): its dart
      # child needs the cluster DNS to resolve the headless Service peers,
      # and a regular Pod identity for the stable HRW node hostname file.
      containers:
      - name: agent
        image: {{ include "fast-sandbox.image" .Values.runtimeAgent.image }}
        imagePullPolicy: {{ .Values.runtimeAgent.image.pullPolicy }}
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: FAST_SANDBOX_RUNTIME_AGENT_SOCKET
          value: {{ .Values.runtimeAgent.socketDir }}/runtime.sock
        # Artifact store: the fast-sandbox-artifact-store ConfigMap is
        # mounted below and read per pull, so an edit applies without a
        # restart.
        - name: FAST_SANDBOX_STATE_ROOT
          value: {{ .Values.runtimeAgent.stateRoot }}
        - name: FAST_SANDBOX_REGISTRY_CONFIG_PATH
          value: /etc/fast-sandbox/agent/registry.json
        # Non-empty DART addr enables the node-local DART child process and
        # routes artifact pulls through its prefix API; the image carries the
        # pinned dart binary.
        - name: FAST_SANDBOX_DART_ADDR
          value: http://127.0.0.1:8145
        # Peer discovery via the headless dart Service; the agent falls back
        # to direct S3 when DART is unreachable.
        - name: FAST_SANDBOX_DART_DISCOVER
          value: {{ $dartDiscover }}
        - name: FAST_SANDBOX_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        securityContext:
          privileged: true
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - {{ $probeCmd | quote }}
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
        ports:
        - name: peer
          containerPort: {{ .Values.runtimeAgent.dartPeerPort }}
          protocol: TCP
        volumeMounts:
        - name: agent-socket
          mountPath: {{ .Values.runtimeAgent.socketDir }}
        - name: agent-state
          mountPath: {{ .Values.runtimeAgent.stateRoot }}
        - name: agent-registry
          mountPath: /etc/fast-sandbox/agent
          readOnly: true
        - name: artifact-store
          mountPath: /etc/fast-sandbox/artifact-store
          readOnly: true
        - name: node-hostname
          mountPath: /etc/hostname
          readOnly: true
      volumes:
      - name: agent-socket
        hostPath:
          path: {{ .Values.runtimeAgent.socketDir }}
          type: DirectoryOrCreate
      - name: agent-state
        hostPath:
          path: {{ .Values.runtimeAgent.stateRoot }}
          type: DirectoryOrCreate
      - name: agent-registry
        secret:
          secretName: {{ .Values.runtimeAgent.registrySecret }}
      # Shared artifact store root/endpoint, read per pull (live ConfigMap
      # edits land without an agent restart).
      - name: artifact-store
        configMap:
          name: fast-sandbox-artifact-store
          optional: true
      # The stable node identity for the HRW keyspace.
      - name: node-hostname
        hostPath:
          path: /etc/hostname
          type: File
{{- end }}
