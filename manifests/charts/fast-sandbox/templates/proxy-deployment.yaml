{{- if .Values.proxy.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-sandbox-proxy
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
    app: fast-sandbox-proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      app: fast-sandbox-proxy
  template:
    metadata:
      labels:
        app: fast-sandbox-proxy
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9094"
        prometheus.io/scrape: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: proxy
        args:
        - --bind-address=:8080
        - --metrics-bind-address=:9094
        - --fastlet-proxy-port=5780
        env:
        - name: FAST_SANDBOX_ROUTE_VERIFY_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.routeKeys.existingSecret | default "fast-sandbox-route-keys" }}
              key: public-key
        image: {{ include "fast-sandbox.image" .Values.proxy.image }}
        imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9094
        resources:
          {{- toYaml .Values.proxy.resources | nindent 10 }}
      serviceAccountName: fast-sandbox-proxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fast-sandbox-proxy
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fast-sandbox-proxy
{{- end }}
